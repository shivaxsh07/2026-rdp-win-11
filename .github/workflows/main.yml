name: kali linux

on:
  workflow_dispatch:
  # Manual trigger ONLY — go to Actions tab and click "Run workflow"
  # Pushing to repo will NOT trigger this

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    # GitHub has no Kali runner so we use Ubuntu as the base OS
    # We install Kali packages on top of it
    timeout-minutes: 350
    # Keeps the runner alive for up to 350 minutes (GitHub max is 360)

    steps:

      - name: Add Kali Repository
        run: |
          # Step 1 — Tell apt WHERE to find Kali packages
          echo "deb http://http.kali.org/kali kali-rolling main non-free contrib" \
            | sudo tee /etc/apt/sources.list.d/kali.list
          # kali-rolling = latest rolling release packages
          # main non-free contrib = all package categories

          # Step 2 — Import Kali's GPG signing key
          # Without this apt will REFUSE to trust the Kali repo
          wget -q -O - https://archive.kali.org/archive-key.asc | sudo apt-key add -

          # Step 3 — Refresh apt's package index with Kali repo now added
          sudo apt-get update -y

      - name: Install Kali Desktop + XRDP
        run: |
          # DEBIAN_FRONTEND=noninteractive = skip all "press Y to continue" prompts
          # Otherwise the install hangs waiting for input nobody types
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            kali-desktop-xfce \
            # Kali's official XFCE desktop — lightweight, runs well on a runner
            xrdp \
            # The actual RDP server — this is what your RDP client connects to
            xfce4 \
            # XFCE desktop environment core
            xfce4-terminal \
            # Terminal emulator inside the desktop
            dbus-x11 \
            # D-Bus X11 bridge — desktop sessions NEED this or they won't start
            x11-xserver-utils
            # X11 tools — needed for display resolution and screen setup

      - name: Create User sivnsh7
        run: |
          # Create user sivnsh7 with a home directory (-m) and bash as their shell (-s)
          # The "|| true" means: if user already exists, don't crash — just move on
          sudo useradd -m -s /bin/bash sivnsh7 || true

          # Set the password to "root"
          # chpasswd reads "username:password" from stdin — cleanest way to do it
          echo "sivnsh7:root" | sudo chpasswd

          # Add sivnsh7 to the sudo group so they have admin rights inside the session
          sudo usermod -aG sudo sivnsh7

          # Give passwordless sudo — some desktop actions silently need sudo
          # Without this you get frozen auth popups mid-session
          echo "sivnsh7 ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers

      - name: Configure XRDP to Launch XFCE
        run: |
          # This file tells XRDP which desktop to launch when sivnsh7 logs in
          # Without .xsession XRDP connects but shows a BLANK black screen
          echo "startxfce4" | sudo tee /home/sivnsh7/.xsession

          # Fix ownership — the file must belong to sivnsh7 not root
          sudo chown sivnsh7:sivnsh7 /home/sivnsh7/.xsession

          # Make it executable — XRDP runs it as a script
          sudo chmod +x /home/sivnsh7/.xsession

          # Set the RDP listening port to 3389 (standard RDP port clients expect)
          sudo sed -i 's/^port=.*/port=3389/' /etc/xrdp/xrdp.ini

          # Bump color depth — better visuals over the RDP connection
          sudo sed -i 's/max_bpp=32/max_bpp=128/' /etc/xrdp/xrdp.ini

          # Polkit fix — this is a VERY common XRDP gotcha
          # Without it a color manager auth popup appears and FREEZES the session
          sudo bash -c 'cat > /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla <<EOF
[Allow Colord all Users]
Identity=unix-user:*
Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
ResultAny=no
ResultInactive=no
ResultActive=yes
EOF'

          # Enable XRDP so it auto-starts (good practice)
          sudo systemctl enable xrdp

          # Start XRDP right now
          sudo systemctl start xrdp

          # Give XRDP 4 seconds to fully initialize before we check it
          sleep 4

          # Print XRDP status — the "|| true" stops a non-zero exit from killing the job
          sudo systemctl status xrdp --no-pager || true

      - name: Install Tailscale
        run: |
          # Tailscale's official installer handles everything:
          # repo setup, GPG keys, apt install — one line does it all
          curl -fsSL https://tailscale.com/install.sh | sudo sh

      - name: Connect to Tailscale Network
        run: |
          # --authkey: your secret from tailscale.com/settings/keys
          #            stored in repo Settings → Secrets → TAILSCALE_AUTHKEY
          # --hostname: gives this runner a name you can see in Tailscale admin panel
          # --accept-routes: lets this machine use subnet routes from your network
          # --accept-dns=false: skip Tailscale DNS so apt/curl still work normally
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --hostname=kali-$GITHUB_RUN_ID \
            --accept-routes \
            --accept-dns=false

          # Poll until Tailscale assigns an IPv4 address
          # Sometimes it takes a few seconds after "up" runs
          TSIP=""
          RETRIES=0
          while [ -z "$TSIP" ] && [ $RETRIES -lt 15 ]; do
            # "tailscale ip -4" returns the IPv4 — empty string if not ready yet
            TSIP=$(sudo tailscale ip -4 2>/dev/null || true)
            sleep 5
            RETRIES=$((RETRIES + 1))
          done
          # 15 retries × 5 seconds = 75 seconds max wait

          # If after 75 seconds still no IP — auth key is wrong or Tailscale is down
          if [ -z "$TSIP" ]; then
            echo "ERROR: No Tailscale IP after 75s. Is TAILSCALE_AUTHKEY set correctly?"
            exit 1
          fi

          # Write the IP to GITHUB_ENV so all future steps can read it as $TAILSCALE_IP
          echo "TAILSCALE_IP=$TSIP" >> $GITHUB_ENV
          echo "Tailscale IP assigned: $TSIP"

      - name: Verify RDP Port is Open
        run: |
          echo "Checking port 3389 on $TAILSCALE_IP..."

          # nc -zv = netcat in scan mode, verbose output
          # This confirms XRDP is actually accepting connections before we print creds
          nc -zv "$TAILSCALE_IP" 3389 \
            && echo "Port 3389 OPEN — RDP is live and ready." \
            || echo "Port 3389 not responding — XRDP may still be starting up."

      - name: Print Creds and Hold Runner Alive
        run: |
          echo ""
          echo "==============================="
          echo "   KALI LINUX RDP READY"
          echo "==============================="
          echo "  Host : $TAILSCALE_IP"
          echo "  Port : 3389"
          echo "  User : sivnsh7"
          echo "  Pass : root"
          echo "==============================="
          echo ""

          # Infinite loop — keeps the GitHub Actions runner alive
          # Without this the job finishes instantly and your RDP session dies
          # Runner stays up until the 350 minute timeout kills it
          while true; do
            echo "[$(date '+%H:%M:%S')] Kali RDP running — session active..."
            sleep 300
            # Prints a heartbeat every 5 minutes so GitHub knows the job is still alive
          done
