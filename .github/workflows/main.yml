name: ssh tailscale

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SSH_USER: sivnsh7
      SSH_PASS: root

    steps:

      - name: Install OpenSSH
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y openssh-server

      - name: Create User and Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          # Create user
          sudo useradd --create-home --shell /bin/bash "$SSH_USER" || true
          printf '%s:%s\n' "$SSH_USER" "$SSH_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USER"
          echo "$SSH_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers

          # Enable password login
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*UsePAM.*/UsePAM yes/' /etc/ssh/sshd_config

          # Start SSH
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          # Verify port 22 is open
          sleep 3
          nc -z -w 5 127.0.0.1 22 \
            && echo "SSH up on port 22" \
            || { echo "SSH failed to start" >&2; exit 1; }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ssh-${{ github.run_id }}

      - name: Get IP and Print SSH Command
        shell: bash
        run: |
          set -euo pipefail

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "No Tailscale IP — is TAILSCALE_AUTHKEY set?" >&2
            exit 1
          fi

          echo ""
          echo "==============================="
          echo "        SSH READY              "
          echo "==============================="
          echo "  ssh $SSH_USER@$TAILSCALE_IP"
          echo "  Password : $SSH_PASS"
          echo "==============================="
          echo ""

      - name: Keep Runner Alive
        shell: bash
        run: |
          while sleep 300; do
            if ! systemctl is-active --quiet ssh; then
              echo "SSH dropped — restarting..." >&2
              sudo systemctl restart ssh
            fi
            echo "[$(date '+%H:%M:%S')] SSH active..."
          done
