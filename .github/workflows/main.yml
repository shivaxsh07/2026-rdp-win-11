name: Temporary XFCE desktop over Tailscale

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-26.04
    timeout-minutes: 350

    # GitHub issues a short-lived OIDC token for Tailscale authentication.
    permissions:
      id-token: write

    env:
      RDP_USER: sivnsh7

    steps:
      - name: Install XFCE and XRDP
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            dbus-x11 \
            netcat-openbsd \
            xorgxrdp \
            xrdp \
            xfce4 \
            xfce4-terminal

      - name: Create temporary RDP login and configure XFCE
        shell: bash
        run: |
          set -euo pipefail

          # Fresh random password for this run; it is not hard-coded.
          RDP_PASSWORD="$(openssl rand -hex 18)"

          sudo useradd --create-home --shell /bin/bash "$RDP_USER"
          printf '%s:%s\n' "$RDP_USER" "$RDP_PASSWORD" | sudo chpasswd

          printf '%s\n' 'xfce4-session' \
            | sudo tee "/home/$RDP_USER/.xsession" >/dev/null
          sudo chown "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.xsession"
          sudo chmod 0700 "/home/$RDP_USER/.xsession"

          # Available to later steps in this job only; it is not permanent storage.
          printf 'RDP_PASSWORD=%s\n' "$RDP_PASSWORD" >> "$GITHUB_ENV"
          unset RDP_PASSWORD

      - name: Start XRDP and check the local listener
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl enable --now xrdp

          ready=0
          for _ in {1..30}; do
            if nc -z -w 2 127.0.0.1 3389; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "XRDP did not start listening on port 3389." >&2
            sudo systemctl status xrdp --no-pager || true
            sudo journalctl -u xrdp -n 80 --no-pager || true
            exit 1
          fi

      - name: Connect this runner to Tailscale
        uses: tailscale/github-action@v4.2.0
        with:
          # Replace these two non-secret placeholders with the values from
          # your Tailscale federated identity configuration.
          oauth-client-id: "REPLACE_WITH_TAILSCALE_CLIENT_ID"
          audience: "REPLACE_WITH_TAILSCALE_AUDIENCE"
          tags: tag:ci
          hostname: rdp-${{ github.run_id }}
          version: latest

      - name: Get the Tailscale address and show connection details
        shell: bash
        run: |
          set -euo pipefail

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"
          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "Tailscale did not assign an IPv4 address." >&2
            sudo tailscale status || true
            exit 1
          fi

          printf 'TAILSCALE_IP=%s\n' "$TAILSCALE_IP" >> "$GITHUB_ENV"

          {
            printf '## Temporary RDP desktop\n\n'
            printf '%s\n' 'Use an RDP client on a device allowed by your Tailscale access policy.'
            printf '%s\n\n' '- Desktop: Ubuntu XFCE'
            printf '%s\n' "- Host: \`$TAILSCALE_IP\`"
            printf '%s\n' '- Port: `3389`'
            printf '%s\n' "- Username: \`$RDP_USER\`"
            printf '%s\n' "- Password: \`$RDP_PASSWORD\`"
            printf '\n%s\n' 'This password and runner are temporary. The password is visible to people who can read this repository’s Actions run.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Connection details are in this run's Actions job summary."

      - name: Keep the temporary desktop running
        shell: bash
        run: |
          set -euo pipefail

          echo "The runner will stop when this workflow is cancelled or reaches its timeout."
          while sleep 300; do
            if ! systemctl is-active --quiet xrdp; then
              echo "XRDP stopped unexpectedly." >&2
              sudo systemctl status xrdp --no-pager || true
              exit 1
            fi
            echo "XRDP is still running."
          done
