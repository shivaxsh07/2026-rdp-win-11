name: kali linux rdp

on:
  workflow_dispatch:

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      id-token: write
      contents: read

    env:
      RDP_USER: sivnsh7
      RDP_PASS: root

    steps:

      - name: Install XFCE + XRDP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            dbus-x11 \
            netcat-openbsd \
            xorgxrdp \
            xrdp \
            xfce4 \
            xfce4-terminal \
            xfce4-goodies

      - name: Create User sivnsh7 with password root
        shell: bash
        run: |
          set -euo pipefail

          sudo useradd --create-home --shell /bin/bash "$RDP_USER" || true
          printf '%s:%s\n' "$RDP_USER" "$RDP_PASS" | sudo chpasswd

          # Add to sudo group
          sudo usermod -aG sudo "$RDP_USER"

          # Passwordless sudo inside session
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers

          # Tell XRDP to launch XFCE on login
          echo 'xfce4-session' \
            | sudo tee "/home/$RDP_USER/.xsession" > /dev/null
          sudo chown "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.xsession"
          sudo chmod 0700 "/home/$RDP_USER/.xsession"

          # Fix the colour-manager auth popup that freezes XRDP sessions
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d
          sudo bash -c 'cat > /etc/polkit-1/localauthority/50-local.d/45-colord.pkla <<EOF
[Allow Colord]
Identity=unix-user:*
Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
ResultAny=no
ResultInactive=no
ResultActive=yes
EOF'

      - name: Start XRDP and Verify Port 3389
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl enable --now xrdp

          ready=0
          for _ in {1..30}; do
            if nc -z -w 2 127.0.0.1 3389; then
              ready=1
              break
            fi
            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "XRDP failed to start on port 3389" >&2
            sudo systemctl status xrdp --no-pager || true
            sudo journalctl -u xrdp -n 100 --no-pager || true
            exit 1
          fi

          echo "XRDP is up and listening on port 3389"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: kali-rdp-${{ github.run_id }}

      - name: Get Tailscale IP and Print Creds
        shell: bash
        run: |
          set -euo pipefail

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"

          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "Tailscale IP not assigned — check your TAILSCALE_AUTHKEY secret" >&2
            sudo tailscale status || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo ""
          echo "==============================="
          echo "      KALI LINUX RDP READY     "
          echo "==============================="
          echo "  Host     : $TAILSCALE_IP"
          echo "  Port     : 3389"
          echo "  Username : $RDP_USER"
          echo "  Password : $RDP_PASS"
          echo "==============================="
          echo ""

      - name: Hold Runner Alive
        shell: bash
        run: |
          echo "Session is live. Runner stays up until timeout or you cancel the workflow."

          while sleep 300; do
            if ! systemctl is-active --quiet xrdp; then
              echo "XRDP stopped unexpectedly" >&2
              sudo systemctl status xrdp --no-pager || true
              exit 1
            fi
            echo "[$(date '+%H:%M:%S')] XRDP still running..."
          done
